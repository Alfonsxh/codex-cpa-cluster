name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install frontend and OpenAPI dependencies
        run: |
          npm ci --prefix frontend --registry=https://registry.npmmirror.com
          npm ci --prefix tools/openapi --registry=https://registry.npmmirror.com

      - name: Run local quality gate
        run: make verify

  browser:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install browser dependencies
        run: |
          npm ci --prefix frontend --registry=https://registry.npmmirror.com
          npx --prefix frontend playwright install chromium

      - name: Run React browser matrix
        run: npm --prefix frontend run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [validate, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release archive
        run: sh scripts/package-release.sh "dist/codex-cpa-cluster-${GITHUB_SHA::12}.tar.gz"

      - name: Verify Go-only release archive
        run: |
          archive="dist/codex-cpa-cluster-${GITHUB_SHA::12}.tar.gz"
          go run ./cmd/releasectl archive verify "$archive"
          tar -tzf "$archive" | grep -Fx docker-compose.yml
          tar -tzf "$archive" | grep -Fx release-manifest.json
          tar -tzf "$archive" | grep -Fx v2/Dockerfile
          tar -tzf "$archive" | grep -Fx cmd/admin/main.go
          tar -tzf "$archive" | grep -Fx cmd/gateway/main.go
          tar -tzf "$archive" | grep -Fx cmd/releasectl/main.go
          tar -tzf "$archive" | grep -Fx internal/gateway/server.go
          tar -tzf "$archive" | grep -Fx frontend/package.json
          tar -tzf "$archive" | grep -Fx tools/openapi/package.json
          removed_source_suffix=$(printf '.%s%s' p y)
          removed_requirement_prefix=$(printf 'require%s' ments)
          if tar -tzf "$archive" | grep -Eq "(^|/)node_modules/|^frontend/dist/|\\${removed_source_suffix}$|${removed_requirement_prefix}[^/]*\\.txt$"; then
            echo "release archive contains generated dependencies or removed runtime files" >&2
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codex-cpa-cluster-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
