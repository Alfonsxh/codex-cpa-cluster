name: ${COMPOSE_PROJECT_NAME:-cliproxy-multi}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  admin:
    image: ${ADMIN_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-admin
    restart: unless-stopped
    logging: *json-logging
    working_dir: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
    command: ["python3", "/opt/codex-cpa-runtime/admin/server.py"]
    environment:
      CLIPROXY_APP_ROOT: /opt/codex-cpa-runtime
      CLIPROXY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      CLIPROXY_MANAGEMENT_KEY_FILE: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}/secrets/cpa-management.key
      CLIPROXY_GATEWAY_URL: http://edge:8317
      CLIPROXY_GATEWAY_INTERNAL_URL: http://edge:8319
      DEPLOY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      INSTANCE_NAME: ${INSTANCE_NAME:-cliproxy}
    expose:
      - "8318"
    volumes:
      - ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}:${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8318/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  usage-collector:
    image: ${ADMIN_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-usage-collector
    restart: unless-stopped
    logging: *json-logging
    command: ["python3", "/opt/codex-cpa-runtime/admin/usage_collector.py", "--root", "${DEPLOY_ROOT:-/opt/codex-cpa-cluster}"]
    environment:
      CLIPROXY_APP_ROOT: /opt/codex-cpa-runtime
      CLIPROXY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      CLIPROXY_MANAGEMENT_KEY_FILE: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}/secrets/cpa-management.key
      DEPLOY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      INSTANCE_NAME: ${INSTANCE_NAME:-cliproxy}
    volumes:
      - ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}:${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
    healthcheck:
      test: ["CMD", "python3", "/opt/codex-cpa-runtime/admin/usage_collector.py", "--root", "${DEPLOY_ROOT:-/opt/codex-cpa-cluster}", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - admin
    networks:
      - backend

  log-maintenance:
    image: ${ADMIN_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-log-maintenance
    restart: unless-stopped
    logging: *json-logging
    command:
      - python3
      - /opt/codex-cpa-runtime/admin/log_maintenance.py
      - --root
      - ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      - --interval
      - "60"
      - --max-file-size-mb
      - "32"
      - --backups
      - "2"
    environment:
      CLIPROXY_APP_ROOT: /opt/codex-cpa-runtime
      CLIPROXY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      DEPLOY_ROOT: ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
      INSTANCE_NAME: ${INSTANCE_NAME:-cliproxy}
    volumes:
      - ${DEPLOY_ROOT:-/opt/codex-cpa-cluster}:${DEPLOY_ROOT:-/opt/codex-cpa-cluster}
    healthcheck:
      test: ["CMD", "python3", "/opt/codex-cpa-runtime/admin/log_maintenance.py", "--root", "${DEPLOY_ROOT:-/opt/codex-cpa-cluster}", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - admin
    networks:
      - backend

  management:
    image: ${CLIPROXY_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-management
    restart: unless-stopped
    logging: *json-logging
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/configs/config.yaml"]
    ports:
      - "${MANAGEMENT_LISTEN_ADDRESS:?state/compose.env missing}:${MANAGEMENT_PORT:?state/compose.env missing}:8317"
    volumes:
      - ./management/config:/CLIProxyAPI/configs
      - ./management/auth:/root/.cli-proxy-api
      - ./management/logs:/CLIProxyAPI/logs
      - ./management/plugins:/CLIProxyAPI/plugins
    networks:
      - backend

  web:
    image: ${WEB_RUNTIME_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-web
    restart: unless-stopped
    logging: *json-logging
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  gateway-blue:
    image: ${GATEWAY_RUNTIME_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-gateway-blue
    restart: unless-stopped
    logging: *json-logging
    expose:
      - "8317"
      - "8319"
    volumes:
      - ./state/gateway:/var/run/cliproxy-snapshots:ro
      - ./logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  gateway-green:
    image: ${GATEWAY_RUNTIME_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-gateway-green
    restart: unless-stopped
    logging: *json-logging
    expose:
      - "8317"
      - "8319"
    volumes:
      - ./state/gateway:/var/run/cliproxy-snapshots:ro
      - ./logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  edge:
    image: ${EDGE_RUNTIME_IMAGE:?state/compose.env missing; run codex-cpa render}
    container_name: ${INSTANCE_NAME:-cliproxy}-edge
    restart: unless-stopped
    logging: *json-logging
    ports:
      - "${GATEWAY_LISTEN_ADDRESS:?state/compose.env missing}:${GATEWAY_PORT:?state/compose.env missing}:8317"
      - "127.0.0.1:${GATEWAY_INTERNAL_PORT:?state/compose.env missing}:8319"
    volumes:
      - ./state/edge:/var/run/cliproxy-edge:ro
      - ./logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

networks:
  backend:
    name: ${DOCKER_NETWORK_NAME:-cliproxy-backend}
    driver: bridge
