worker_processes auto;
user nobody;
error_log /var/log/cliproxy/edge-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=2s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # The validated active-slot include selects the public listener. Derive the
    # matching internal listener from that exact allowlist so probes can never
    # fall through to the public Gateway server (which intentionally returns
    # 404 for /__internal/* and /__stats).
    map $active_gateway_backend $active_gateway_internal_backend {
        gateway-blue:8317 gateway-blue:8319;
        gateway-green:8317 gateway-green:8319;
        default "";
    }

    server {
        listen 8317;
        server_name _;
        client_max_body_size 100m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Blue is only a parser-safe default. Deployment always creates the
        # fixed active-slot file before Edge starts and replaces it atomically
        # before a graceful reload.
        set $active_gateway_backend gateway-blue:8317;
        include /var/run/cliproxy-edge/active-gateway.conf;

        location = /__health {
            proxy_http_version 1.1;
            proxy_pass http://$active_gateway_backend;
        }

        location ^~ /__internal/ {
            return 404;
        }

        location = /__stats {
            return 404;
        }

        set $web_backend web:8080;
        location = / { proxy_pass http://$web_backend; }
        location = /official-management { proxy_pass http://$web_backend; }
        location = /native { proxy_pass http://$web_backend; }
        location ^~ /native/ { proxy_pass http://$web_backend; }
        location = /my-keys { proxy_pass http://$web_backend; }
        location ^~ /my-keys/ { proxy_pass http://$web_backend; }
        location = /admin { proxy_pass http://$web_backend; }
        location ^~ /admin/ { proxy_pass http://$web_backend; }
        location = /usage { proxy_pass http://$web_backend; }
        location = /usage/api { proxy_pass http://$web_backend; }
        location ^~ /usage/ { proxy_pass http://$web_backend; }
        location ^~ /portal/ { proxy_pass http://$web_backend; }
        location = /site-config.json { proxy_pass http://$web_backend; }
        location = /branding/logo { proxy_pass http://$web_backend; }

        # API data-plane traffic is the default. Edge never reads an API Key;
        # it forwards Authorization unchanged to the active Gateway slot.
        location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://$active_gateway_backend;
        }
    }

    # Host-loopback-only probes are kept behind Edge so Admin and release
    # tooling always inspect the currently active Gateway slot.
    server {
        listen 8319;
        server_name _;
        set $active_gateway_backend gateway-blue:8317;
        include /var/run/cliproxy-edge/active-gateway.conf;

        location ^~ /__internal/ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://$active_gateway_internal_backend;
        }

        location = /__stats {
            proxy_http_version 1.1;
            proxy_pass http://$active_gateway_internal_backend;
        }

        location ^~ / {
            return 404;
        }
    }
}
