name: ${V1_COMPARE_COMPOSE_PROJECT_NAME:-cliproxy-v1-compare}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  docker-read-proxy:
    image: ${V1_COMPARE_DOCKER_READ_PROXY_IMAGE:?V1_COMPARE_DOCKER_READ_PROXY_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-docker-read-proxy
    restart: unless-stopped
    logging: *json-logging
    command:
      - /usr/local/bin/cpa-docker-read-proxy
      - --listen-unix=/var/run/cpa-docker-read/docker.sock
      - --upstream-unix=/var/run/docker-host.sock
      - --compose-project=${V1_COMPARE_LIVE_COMPOSE_PROJECT:?V1_COMPARE_LIVE_COMPOSE_PROJECT is required}
    volumes:
      - ${V1_COMPARE_HOST_DOCKER_SOCKET_PATH:?V1_COMPARE_HOST_DOCKER_SOCKET_PATH is required}:/var/run/docker-host.sock:ro
      - v1-docker-read-socket:/var/run/cpa-docker-read
    healthcheck:
      test: ["CMD", "/usr/local/bin/cpa-docker-read-proxy", "--health", "--listen-unix=/var/run/cpa-docker-read/docker.sock"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - control

  admin:
    image: ${V1_COMPARE_ADMIN_IMAGE:?V1_COMPARE_ADMIN_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-admin
    restart: unless-stopped
    logging: *json-logging
    working_dir: ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}
    command: ["python3", "/opt/cpa-v1-compare/v1-compare-admin.py"]
    environment:
      CLIPROXY_APP_ROOT: /opt/codex-cpa-runtime
      CLIPROXY_ROOT: ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}
      CLIPROXY_V1_COMPARE_MODE: "1"
      CLIPROXY_V1_COMPARE_DOCKER_READ_SOCKET: /var/run/cpa-docker-read/docker.sock
      CLIPROXY_V1_COMPARE_LIVE_COMPOSE_PROJECT: ${V1_COMPARE_LIVE_COMPOSE_PROJECT:?V1_COMPARE_LIVE_COMPOSE_PROJECT is required}
      DOCKER_HOST: unix:///var/run/cpa-docker-read/docker.sock
      CLIPROXY_MANAGEMENT_KEY_FILE: ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/secrets/cpa-management.key
      CLIPROXY_GATEWAY_URL: http://edge:8317
      CLIPROXY_GATEWAY_INTERNAL_URL: http://edge:8319
      DEPLOY_ROOT: ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}
      INSTANCE_NAME: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}
    expose:
      - "8318"
    volumes:
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}:${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}
      - ./scripts/v1-compare-admin.py:/opt/cpa-v1-compare/v1-compare-admin.py:ro
      - v1-docker-read-socket:/var/run/cpa-docker-read
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8318/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      docker-read-proxy:
        condition: service_healthy
    networks:
      - control

  web:
    image: ${V1_COMPARE_WEB_IMAGE:?V1_COMPARE_WEB_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-web
    restart: unless-stopped
    logging: *json-logging
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      admin:
        condition: service_healthy
    networks:
      - control

  gateway-blue:
    image: ${V1_COMPARE_GATEWAY_IMAGE:?V1_COMPARE_GATEWAY_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-gateway-blue
    restart: unless-stopped
    logging: *json-logging
    group_add:
      - "0"
    expose:
      - "8317"
      - "8319"
    volumes:
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/state/gateway:/var/run/cliproxy-snapshots:ro
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - control
      - upstream

  gateway-green:
    image: ${V1_COMPARE_GATEWAY_IMAGE:?V1_COMPARE_GATEWAY_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-gateway-green
    restart: unless-stopped
    logging: *json-logging
    group_add:
      - "0"
    expose:
      - "8317"
      - "8319"
    volumes:
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/state/gateway:/var/run/cliproxy-snapshots:ro
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - control
      - upstream

  edge:
    image: ${V1_COMPARE_EDGE_IMAGE:?V1_COMPARE_EDGE_IMAGE is required}
    container_name: ${V1_COMPARE_INSTANCE_NAME:-cliproxy-v1-compare}-edge
    restart: unless-stopped
    logging: *json-logging
    ports:
      - "${V1_COMPARE_PUBLIC_BIND_ADDRESS:-127.0.0.1}:${V1_COMPARE_PUBLIC_PORT:?V1_COMPARE_PUBLIC_PORT is required}:8317"
      - "127.0.0.1:${V1_COMPARE_INTERNAL_PORT:?V1_COMPARE_INTERNAL_PORT is required}:8319"
    volumes:
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/state/edge:/var/run/cliproxy-edge:ro
      - ${V1_COMPARE_DEPLOY_ROOT:?V1_COMPARE_DEPLOY_ROOT is required}/logs/gateway:/var/log/cliproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      gateway-blue:
        condition: service_healthy
      gateway-green:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - control
      - ingress

networks:
  control:
    driver: bridge
    internal: true
  ingress:
    driver: bridge
  upstream:
    external: true
    name: ${V1_COMPARE_UPSTREAM_NETWORK:?V1_COMPARE_UPSTREAM_NETWORK is required}

volumes:
  v1-docker-read-socket:
