name: codex-cpa-test

x-go-build: &go-build
  context: .
  dockerfile: Dockerfile

services:
  cliproxy-alpha:
    build:
      <<: *go-build
      target: test-upstream
    environment:
      CLIPROXY_TEST_UPSTREAM_INTERNAL_KEY: fixture-internal-key
    expose:
      - "8317"
    networks:
      - test

  gateway-blue:
    build:
      <<: *go-build
      target: gateway
    command:
      - --snapshot-dir=/var/run/cliproxy-snapshots
      - --access-log=
    volumes:
      - ${TEST_GATEWAY_FIXTURE_DIR:-./testdata/runtime/gateway}:/var/run/cliproxy-snapshots:ro
    expose:
      - "8317"
      - "8319"
    depends_on:
      - cliproxy-alpha
    networks:
      - test

  gateway-green:
    build:
      <<: *go-build
      target: gateway
    command:
      - --snapshot-dir=/var/run/cliproxy-snapshots
      - --access-log=
    volumes:
      - ${TEST_GATEWAY_FIXTURE_DIR:-./testdata/runtime/gateway}:/var/run/cliproxy-snapshots:ro
    expose:
      - "8317"
      - "8319"
    depends_on:
      - cliproxy-alpha
    networks:
      - test

  web:
    build:
      <<: *go-build
      target: web
    expose:
      - "8080"
    networks:
      - test

  edge:
    build:
      <<: *go-build
      target: edge
    ports:
      - "127.0.0.1:${TEST_PUBLIC_PORT:-28317}:8317"
      - "127.0.0.1:${TEST_INTERNAL_PORT:-28319}:8319"
    volumes:
      - ${TEST_EDGE_FIXTURE_DIR:-./testdata/runtime/edge}:/var/run/cliproxy-edge:ro
    depends_on:
      - gateway-blue
      - gateway-green
      - web
    networks:
      - test
      - test-ingress

networks:
  test:
    driver: bridge
    internal: true
  # Docker Desktop does not publish host ports from an internal-only network.
  # Only the credential-free Edge joins this ingress bridge; Gateway and the
  # isolated upstream remain on the internal Test network.
  test-ingress:
    driver: bridge
