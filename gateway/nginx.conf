worker_processes auto;
user nobody;
error_log /var/log/cliproxy/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # 只记录 Key 标签和性能数据，禁止记录 Authorization 与请求正文。
    log_format key_stats '$msec\t$key_label\t$account_name\t$status\t$request_time';
    log_format admin_ops '$msec\t$remote_addr\t$request_method\t$uri\t$status\t$request_time';
    access_log /var/log/cliproxy/access.tsv key_stats;

    lua_shared_dict cpa_stats 10m;
    lua_shared_dict usage_cache 2m;
    lua_shared_dict auth_cache 20m;
    lua_shared_dict quota_cache 20m;
    lua_package_path "/usr/local/openresty/nginx/conf/custom/?.lua;;";
    resolver 127.0.0.11 valid=10s ipv6=off;

    header_filter_by_lua_block {
        if ngx.var.http_x_forwarded_proto == "https" then
            ngx.header["Strict-Transport-Security"] = "max-age=0"
        else
            ngx.header["Strict-Transport-Security"] = nil
        end
    }

    init_worker_by_lua_block {
        require("gateway_state").start()
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    # Do not expose arbitrary routes from the selected CLIProxyAPI backend.
    # New upstream management or callback routes stay private by default.
    map $uri $public_api_route_allowed {
        default 0;
        ~^/v1(?:/|$) 1;
        ~^/v1beta(?:/|$) 1;
        ~^/backend-api/codex(?:/|$) 1;
        ~^/api/provider(?:/|$) 1;
        ~^/v1internal:method$ 1;
    }

    server {
        listen 8317;
        server_name _;
        client_max_body_size 100m;
        set $key_label "";
        set $account_name "";
        set $backend "";
        set $upstream_authorization "";

        location = /__health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 运维探针只存在于独立的 8319 监听器；公网入口显式拒绝，
        # 避免 TLS 代理的 Docker 地址被误判为可信来源。
        location ^~ /__internal/ {
            access_log off;
            return 404;
        }

        location = /__stats {
            access_log off;
            return 404;
        }

        # 只有明确批准的模型 API 路径可以进入鉴权与业务 CPA。
        location / {
            if ($public_api_route_allowed = 0) {
                return 404;
            }
            access_by_lua_block {
                require("request_gate").authorize()
                local label = ngx.var.key_label
                if label and label ~= "" then
                    local dict = ngx.shared.cpa_stats
                    dict:incr("inflight:" .. label, 1, 0)
                    dict:set("last_seen:" .. label, ngx.now())
                end
            }

            log_by_lua_block {
                local label = ngx.var.key_label
                if label and label ~= "" then
                    local dict = ngx.shared.cpa_stats
                    local value = dict:incr("inflight:" .. label, -1, 0)
                    if value and value < 0 then
                        dict:set("inflight:" .. label, 0)
                    end
                end
            }

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header Authorization $upstream_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://$backend;
        }
    }

    # 独立的内部监听器仅通过 Docker 网络或宿主机回环映射访问。
    server {
        listen 8319;
        server_name _;
        set $key_label "";
        set $account_name "";
        set $backend "";
        set $upstream_authorization "";

        location = /__internal/probe/models {
            access_log off;
            proxy_http_version 1.1;
            proxy_buffering off;
            access_by_lua_block {
                require("request_gate").authorize({ enforce_quota = false })
            }
            proxy_set_header Host $host;
            proxy_set_header Authorization $upstream_authorization;
            proxy_pass http://$backend/v1/models;
        }

        location = /__internal/snapshots {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.say(cjson.encode(require("gateway_state").status()))
            }
        }

        location = /__stats {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local dict = ngx.shared.cpa_stats
                local result = {}
                for _, key in ipairs(dict:get_keys(0)) do
                    if string.sub(key, 1, 9) == "inflight:" then
                        local label = string.sub(key, 10)
                        table.insert(result, {
                            label = label,
                            account = string.match(label, ":([^:]+)$") or "",
                            inflight = dict:get(key) or 0
                        })
                    end
                end
                table.sort(result, function(left, right) return left.label < right.label end)
                ngx.say(cjson.encode(result))
            }
        }

        location ^~ / {
            access_log off;
            return 404;
        }
    }
}
