name: ${CPA_COMPOSE_PROJECT_NAME:-codex-cpa}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-control-service: &control-service
  image: ${CPA_CONTROL_IMAGE:?CPA_CONTROL_IMAGE is required}
  restart: unless-stopped
  logging: *json-logging
  environment:
    CLIPROXY_ROOT: ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
  volumes:
    - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}:${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}

x-worker-health: &worker-health
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 20s

services:
  # scripts/deploy.sh owns dependency ordering and readiness checks.
  # Keep service definitions dependency-free so config hashes remain compatible
  # with the runtime labels emitted by supported Docker Compose versions.
  gateway-blue:
    image: ${CPA_GATEWAY_IMAGE:?CPA_GATEWAY_IMAGE is required}
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-gateway-blue
    restart: unless-stopped
    logging: *json-logging
    group_add:
      - "65534"
    command:
      - --snapshot-dir=/var/run/cliproxy-snapshots
      - --access-log=/var/log/cliproxy/access.tsv
    volumes:
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}/state/gateway:/var/run/cliproxy-snapshots:ro
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}/logs/gateway:/var/log/cliproxy
    expose:
      - "8317"
      - "8319"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8319/__internal/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - control
      - upstream

  gateway-green:
    image: ${CPA_GATEWAY_IMAGE:?CPA_GATEWAY_IMAGE is required}
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-gateway-green
    restart: unless-stopped
    logging: *json-logging
    group_add:
      - "65534"
    command:
      - --snapshot-dir=/var/run/cliproxy-snapshots
      - --access-log=/var/log/cliproxy/access.tsv
    volumes:
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}/state/gateway:/var/run/cliproxy-snapshots:ro
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}/logs/gateway:/var/log/cliproxy
    expose:
      - "8317"
      - "8319"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8319/__internal/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - control
      - upstream

  admin:
    <<: *control-service
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-admin
    command:
      - /usr/local/bin/cpa-admin
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
      - --gateway-probe-url=http://edge:8319
      - --compose-project=${CPA_ACCOUNT_COMPOSE_PROJECT:?CPA_ACCOUNT_COMPOSE_PROJECT is required}
      - --control-compose-project=${CPA_COMPOSE_PROJECT_NAME:-codex-cpa}
      - --docker-network-name=${CPA_UPSTREAM_NETWORK:?CPA_UPSTREAM_NETWORK is required}
      - --instance-name=${CPA_ACCOUNT_INSTANCE_NAME:?CPA_ACCOUNT_INSTANCE_NAME is required}
    expose:
      - "8318"
    environment:
      CLIPROXY_ROOT: ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}:${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
      - ${CPA_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8318/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - control
      - upstream

  web:
    image: ${CPA_WEB_IMAGE:?CPA_WEB_IMAGE is required}
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-web
    restart: unless-stopped
    logging: *json-logging
    command:
      - --admin-target=http://admin:8318
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - control

  edge:
    image: ${CPA_EDGE_IMAGE:?CPA_EDGE_IMAGE is required}
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-edge
    restart: unless-stopped
    logging: *json-logging
    command:
      - --active-gateway-file=/var/run/cliproxy-edge/active-gateway.conf
      - --web-target=http://web:8080
      - --blue-public-target=http://gateway-blue:8317
      - --blue-internal-target=http://gateway-blue:8319
      - --green-public-target=http://gateway-green:8317
      - --green-internal-target=http://gateway-green:8319
    ports:
      - "${CPA_PUBLIC_BIND_ADDRESS:-127.0.0.1}:${CPA_PUBLIC_PORT:?CPA_PUBLIC_PORT is required}:8317"
      - "127.0.0.1:${CPA_INTERNAL_PORT:?CPA_INTERNAL_PORT is required}:8319"
    volumes:
      - ${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}/state/edge:/var/run/cliproxy-edge:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8317/__health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - control
      - ingress

  usage-collector:
    <<: *control-service
    profiles: ["writers"]
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-usage-collector
    command:
      - /usr/local/bin/cpa-collector
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - /usr/local/bin/cpa-collector
        - --root=${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
        - --health
    networks:
      - control
      - upstream

  quota:
    <<: *control-service
    profiles: ["writers"]
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-quota
    command:
      - /usr/local/bin/cpa-quota
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - /usr/local/bin/cpa-quota
        - --root=${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
        - --health
    networks:
      - control
      - upstream

  account-failover:
    <<: *control-service
    profiles: ["writers"]
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-account-failover
    command:
      - /usr/local/bin/cpa-failover
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
      - --gateway-probe-url=http://edge:8319
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - /usr/local/bin/cpa-failover
        - --root=${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
        - --health
    networks:
      - control
      - upstream

  log-maintenance:
    <<: *control-service
    profiles: ["writers"]
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-log-maintenance
    command:
      - /usr/local/bin/cpa-log-maintenance
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - /usr/local/bin/cpa-log-maintenance
        - --root=${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
        - --health
    networks:
      - control

  notifications:
    <<: *control-service
    profiles: ["external-effects"]
    container_name: ${CPA_INSTANCE_NAME:-codex-cpa}-notifications
    command:
      - /usr/local/bin/cpa-notifications
      - --runtime-owner=${CPA_RUNTIME_OWNER:-codex-cpa}
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - /usr/local/bin/cpa-notifications
        - --root=${CPA_DEPLOY_ROOT:?CPA_DEPLOY_ROOT is required}
        - --health
    networks:
      - control
      - upstream

networks:
  control:
    driver: bridge
    internal: true
  ingress:
    driver: bridge
  upstream:
    external: true
    name: ${CPA_UPSTREAM_NETWORK:?CPA_UPSTREAM_NETWORK is required}
