worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    etag on;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/javascript;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin assets use explicit version query parameters in index.html. Only
    # those immutable URLs receive long-lived caching; unversioned requests
    # must revalidate so operational/debug requests cannot become stale.
    map $arg_v $admin_static_cache_control {
        default "public, max-age=31536000, immutable";
        "" "no-cache";
    }

    # Edge supplies X-Real-IP. Fall back to the direct peer for health checks
    # or isolated deployments that access Web without Edge.
    map $http_x_real_ip $admin_client_key {
        default $http_x_real_ip;
        "" $binary_remote_addr;
    }
    map $http_x_forwarded_proto $admin_hsts {
        default "";
        https "max-age=0";
    }
    limit_req_zone $admin_client_key zone=admin_api_per_ip:10m rate=30r/s;
    limit_conn_zone $admin_client_key zone=admin_api_conn_per_ip:10m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 100m;
        # Keep image-build syntax validation independent of Compose DNS. The
        # Docker resolver resolves this service name only when a request is
        # proxied in the running Compose network.
        set $admin_backend admin:8318;

        location = / {
            try_files /portal/index.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        }

        location /portal/ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /official-management { return 302 /native/; }
        location = /native { return 308 /native/; }
        location = /native/ {
            try_files /portal/native.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        }
        location = /native/accounts.json { return 404; }

        location = /my-keys { return 308 /usage/; }
        location = /my-keys/ { return 308 /usage/; }

        location = /usage { return 308 /usage/; }
        location /usage/ {
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }

        location = /usage/api {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Management-Key "";
            proxy_set_header Authorization "";
            proxy_pass http://$admin_backend;
        }

        location = /site-config.json {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Management-Key "";
            proxy_set_header Authorization "";
            proxy_pass http://$admin_backend;
        }
        location = /branding/logo {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Management-Key "";
            proxy_set_header Authorization "";
            proxy_pass http://$admin_backend;
        }
        location ~ ^/(?:my-keys/api|usage/(?:limits|session|me|me/route|me/usage-breakdown|me/group|me/password|me/key/rotate))$ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Management-Key "";
            proxy_set_header Authorization "";
            proxy_pass http://$admin_backend;
        }

        location = /admin { return 308 /admin/; }

        # Keep dynamic runtime colors behind Admin because they depend on the
        # current configuration and intentionally retain no-store semantics.
        location = /admin/reasoning-effort-colors.css {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://$admin_backend;
        }

        # API requests remain dynamic. The generous burst and connection cap
        # absorb normal dashboard polling while bounding accidental fan-out.
        location ^~ /admin/api/ {
            limit_req zone=admin_api_per_ip burst=60 nodelay;
            # Match the Admin server's default worker capacity so normal
            # concurrent reads reach the bounded executor before load shedding.
            limit_conn admin_api_conn_per_ip 32;
            limit_req_status 429;
            limit_conn_status 429;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://$admin_backend;
        }

        # HTML always revalidates and receives Nginx's ETag/Last-Modified.
        location = /admin/ {
            try_files /admin/index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security $admin_hsts always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }
        location = /admin/index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security $admin_hsts always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }

        # Keep the static allowlist narrow; other /admin paths must not expose
        # files accidentally copied into the image in a future build.
        location ~ ^/admin/(?:app\.js|app\.css|monitor-utils\.js|view-state-utils\.js)$ {
            try_files $uri =404;
            add_header Cache-Control $admin_static_cache_control always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security $admin_hsts always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }
        location /admin/ { return 404; }

        location / { return 404; }
    }
}
