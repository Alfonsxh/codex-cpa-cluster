# 本文件只提供本地构建上下文；生产部署不得加载它。
x-gateway-build: &gateway-build
  context: .
  dockerfile: gateway/Dockerfile
  args:
    GATEWAY_BASE_IMAGE: ${GATEWAY_IMAGE:-docker.m.daocloud.io/openresty/openresty:1.31.1.1-2-alpine-fat@sha256:427d94fea0c24b099e7891e8d1b7976f6d008e2d427e56bab725c8b8b293795b}

services:
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        ADMIN_BASE_IMAGE: ${ADMIN_BASE_IMAGE:-docker.m.daocloud.io/library/docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        WEB_BASE_IMAGE: ${WEB_BASE_IMAGE:-docker.m.daocloud.io/library/nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}

  gateway-blue:
    build: *gateway-build

  gateway-green:
    build: *gateway-build

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
      args:
        EDGE_BASE_IMAGE: ${EDGE_IMAGE:-docker.m.daocloud.io/openresty/openresty:1.31.1.1-2-alpine-fat@sha256:427d94fea0c24b099e7891e8d1b7976f6d008e2d427e56bab725c8b8b293795b}
